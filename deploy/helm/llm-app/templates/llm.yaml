{{- $ctx := dict "name" "llm" "root" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm
  labels: {{- include "llm-app.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  labels: {{- include "llm-app.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "llm-app.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels: {{- include "llm-app.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.llm.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "llm-app.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "llm-app.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: llm
      automountServiceAccountToken: false
      securityContext: {{- include "llm-app.podSecurityContext" . | nindent 8 }}
      initContainers:
        # Block until the download job has written and verified the model.
        - name: wait-for-model
          image: {{ .Values.tools.image }}
          command: ["sh", "-c"]
          args:
            - |
              until [ -f "{{ include "llm-app.modelMarker" . }}" ]; do
                echo "waiting for verified model at {{ include "llm-app.modelPath" . }}"; sleep 5
              done
              echo "model present and verified"
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext: {{- include "llm-app.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: llm
          image: {{ include "llm-app.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --model
            - {{ include "llm-app.modelPath" . }}
            - --alias
            - qwen2.5-0.5b-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --threads
            - {{ .Values.llm.threads | quote }}
            - --ctx-size
            - {{ .Values.llm.contextSize | quote }}
            - --parallel
            - {{ .Values.llm.parallel | quote }}
            - --metrics
            - --no-webui
          env:
            # llama-server reads the key from this variable; it is never on the command line.
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: LLM_API_KEY
          ports:
            - name: http
              containerPort: 8080
          # /health returns 503 while the model loads and 200 once ready.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.llm.resources | nindent 12 }}
          securityContext: {{- include "llm-app.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-store
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm
  labels: {{- include "llm-app.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "llm-app.selector" $ctx | nindent 6 }}
