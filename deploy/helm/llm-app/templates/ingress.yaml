{{- if .Values.ingress.enabled }}
{{- /* An empty allowlist would mean "allow everyone" - refuse to render. */ -}}
{{- if not .Values.ingress.allowedSourceRanges }}
{{- fail "ingress.allowedSourceRanges must not be empty" }}
{{- end }}
# Only the gateway is exposed. TLS terminates at Traefik with the self-signed
# cert from Terraform; the IP allowlist middleware returns 403 to anyone else.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ip-allowlist
  labels: {{- include "llm-app.labels" (dict "name" "gateway" "root" .) | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.allowedSourceRanges | nindent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels: {{- include "llm-app.labels" (dict "name" "gateway" "root" .) | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-ip-allowlist@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
{{- end }}
